<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zikly — Artist profile</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/artist.css">
  <script src="js/config/runtime.js"></script>
</head>
<body>
  <div id="demo-banner" class="demo-banner hidden">Demo preview — connect Supabase for production artist data.</div>
  <header class="topbar shell">
    <a class="brand" href="index.html">Zikly<span>.</span></a>
    <button class="menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><i class="icon-menu"></i></button>
    <nav class="main-nav" aria-label="Primary navigation">
      <a class="nav-link" href="index.html#discover">Discover</a><a class="nav-link" href="projects.html">Explore Projects</a><a class="nav-link" href="creators.html">Explore Creators</a>
      <a class="btn btn-small" href="auth.html">Sign in</a>
    </nav>
  </header>
  <main class="shell" id="artist-main">
    <section class="artist-cover">
      <img class="artist-cover-image" alt="" loading="eager" decoding="async">
      <div class="artist-cover-content">
        <div class="artist-avatar" aria-label="Artist profile picture">
          <i class="icon-music-2"></i>
          <img class="artist-avatar-image" alt="" loading="eager" decoding="async">
        </div>
        <div class="artist-heading">
          <span class="eyebrow">Artist profile</span>
          <h1 id="artist-name">Loading...</h1>
          <p id="artist-bio" class="muted"></p>
        </div>
        <div class="artist-actions">
          <button class="btn btn-outline btn-small" id="share-profile" type="button"><i class="icon-share-2"></i> Share</button>
        </div>
      </div>
    </section>
    <div class="artist-content">
      <section id="subscription-card" class="subscription-card hidden"></section>
      <section id="artist-social-links" class="artist-social-links hidden" aria-label="Creator social links"></section>
      <div id="category-tabs"></div>
      <section id="projects" class="projects-grid" aria-live="polite"></section>
    </div>
  </main>
  <script type="module" src="js/pages/artist.js"></script>
  <script type="module" src="js/components/navigation.js"></script>
</body>
</html>
