<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zikly — Project</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/project.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner hidden">Demo preview — connect Supabase and Fapshi for live purchases.</div>
  <header class="topbar shell">
    <a class="brand" href="index.html">Zikly<span>.</span></a>
    <button class="menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><i class="icon-menu"></i></button>
    <nav class="main-nav" aria-label="Primary navigation">
      <a class="nav-link" href="index.html#discover">Discover</a><a class="nav-link" href="projects.html">Explore Projects</a><a class="nav-link" href="creators.html">Explore Creators</a>
      <a class="btn btn-small" href="auth.html">Sign in</a>
    </nav>
  </header>
  <main class="shell project-layout" id="project-main">
    <div>
      <div class="project-art" aria-label="Project artwork">
        <i class="icon-disc-3"></i>
        <img id="project-art-image" alt="" loading="eager" decoding="async">
      </div>
      <div id="project-unlock" style="margin-top:16px"></div>
    </div>
    <section class="project-info">
      <span class="eyebrow">Project</span>
      <h1 id="project-title" style="font-size:clamp(2.2rem,8vw,5rem);letter-spacing:-.06em;margin:.25em 0">Loading...</h1>
      <p id="project-description" class="muted"></p>
      <p id="project-meta" class="muted"></p>
      <div id="track-list" class="track-list"></div>
    </section>
  </main>
  <script type="module" src="js/pages/project.js"></script>
  <script type="module" src="js/components/navigation.js"></script>
</body>
</html>
